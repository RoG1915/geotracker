<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌍 GeoTracker - Sistema de Geolocalización</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0a0e14;
            --bg-panel: #111921;
            --bg-card: #1a2332;
            --accent-cyan: #00f0ff;
            --accent-green: #00ff88;
            --accent-orange: #ff6b35;
            --text-primary: #e8f0f7;
            --text-secondary: #7a8b99;
            --border-color: #2a3a4a;
            --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.3);
            --glow-green: 0 0 20px rgba(0, 255, 136, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            overflow: hidden;
        }
        
        /* Grid Background Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }
        
        .app-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100vh;
            position: relative;
            z-index: 1;
        }
        
        /* Sidebar Panel */
        .sidebar {
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .header {
            padding: 25px 20px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-panel) 100%);
        }
        
        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            text-shadow: var(--glow-cyan);
        }
        
        .subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        /* Upload Section */
        .upload-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .upload-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: var(--bg-card);
            position: relative;
            overflow: hidden;
        }
        
        .upload-zone::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,240,255,0.1), transparent);
            transition: left 0.5s ease;
        }
        
        .upload-zone:hover::before {
            left: 100%;
        }
        
        .upload-zone:hover {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }
        
        .upload-zone.dragover {
            border-color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        
        .upload-text {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
        }
        
        .upload-text strong {
            color: var(--accent-cyan);
        }
        
        #file-input {
            display: none;
        }
        
        .btn {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan) 0%, #0088aa 100%);
            color: var(--bg-dark);
        }
        
        .btn-primary:hover {
            box-shadow: var(--glow-cyan);
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            margin-left: 10px;
        }
        
        .btn-secondary:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        
        .btn-demo {
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(135deg, var(--accent-orange) 0%, #cc4400 100%);
            color: white;
        }
        
        /* Stats Section */
        .stats-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .stat-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            border-color: var(--accent-cyan);
        }
        
        .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--accent-cyan);
        }
        
        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        
        /* Locations List */
        .locations-section {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: var(--text-secondary);
            padding: 15px 20px;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
        }
        
        .locations-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }
        
        .locations-list::-webkit-scrollbar {
            width: 6px;
        }
        
        .locations-list::-webkit-scrollbar-track {
            background: var(--bg-card);
        }
        
        .locations-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }
        
        .location-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .location-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--accent-cyan);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .location-card:hover {
            border-color: var(--accent-cyan);
            transform: translateX(5px);
        }
        
        .location-card:hover::before {
            opacity: 1;
        }
        
        .location-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
        
        .location-coords {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: 'Orbitron', sans-serif;
        }
        
        .location-index {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--accent-cyan);
            color: var(--bg-dark);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
        }
        
        /* Map Section */
        .map-container {
            position: relative;
        }
        
        #map {
            width: 100%;
            height: 100vh;
        }
        
        /* Map Controls */
        .map-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .map-btn {
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 45px;
            height: 45px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .map-btn:hover {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }
        
        .map-btn.active {
            background: var(--accent-cyan);
            color: var(--bg-dark);
        }
        
        /* Status Message */
        .status-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: var(--bg-panel);
            border: 1px solid var(--border-color);
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 0.9rem;
            display: none;
            animation: slideUp 0.3s ease;
        }
        
        .status-bar.show {
            display: block;
        }
        
        .status-bar.success {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }
        
        .status-bar.error {
            border-color: var(--accent-orange);
            color: var(--accent-orange);
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        /* Custom Marker Popup */
        .leaflet-popup-content-wrapper {
            background: var(--bg-panel);
            border: 1px solid var(--accent-cyan);
            border-radius: 10px;
            box-shadow: var(--glow-cyan);
        }
        
        .leaflet-popup-content {
            color: var(--text-primary);
            font-family: 'Rajdhani', sans-serif;
            margin: 15px;
        }
        
        .leaflet-popup-tip {
            background: var(--bg-panel);
            border: 1px solid var(--accent-cyan);
        }
        
        .popup-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            color: var(--accent-cyan);
            margin-bottom: 8px;
        }
        
        .popup-coords {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        
        /* Loading Animation */
        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 20, 0.9);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        
        .loading.show {
            display: flex;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 3px solid var(--border-color);
            border-top-color: var(--accent-cyan);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .loading-text {
            margin-top: 20px;
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-cyan);
            letter-spacing: 2px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .app-container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            
            .sidebar {
                max-height: 40vh;
            }
            
            #map {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <div class="loading-text">Procesando...</div>
    </div>
    
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="header">
                <h1 class="logo">GEOTRACKER</h1>
                <p class="subtitle">Sistema de Geolocalización</p>
            </div>
            
            <div class="upload-section">
                <div class="upload-zone" id="upload-zone">
                    <div class="upload-icon">📁</div>
                    <p class="upload-text">
                        Arrastra tu archivo <strong>Excel</strong> aquí<br>
                        o haz clic para seleccionar
                    </p>
                    <input type="file" id="file-input" accept=".xlsx,.xls">
                    <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                        Seleccionar Archivo
                    </button>
                </div>
                <button class="btn btn-demo" onclick="loadDemoData()">
                    🚀 Cargar Datos de Demostración
                </button>
            </div>
            
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="total-locations">0</div>
                        <div class="stat-label">Ubicaciones</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="current-zoom">--</div>
                        <div class="stat-label">Zoom</div>
                    </div>
                </div>
            </div>
            
            <div class="locations-section">
                <div class="section-title">📍 Ubicaciones Cargadas</div>
                <div class="locations-list" id="locations-list">
                    <p style="color: var(--text-secondary); padding: 20px; text-align: center;">
                        Sube un archivo Excel para ver las ubicaciones
                    </p>
                </div>
            </div>
        </aside>
        
        <!-- Map Container -->
        <main class="map-container">
            <div id="map"></div>
            
            <div class="map-controls">
                <button class="map-btn active" id="btn-satellite" title="Vista Satélite" onclick="setMapLayer('satellite')">
                    🛰️
                </button>
                <button class="map-btn" id="btn-streets" title="Vista Calles" onclick="setMapLayer('streets')">
                    🗺️
                </button>
                <button class="map-btn" id="btn-terrain" title="Vista Terreno" onclick="setMapLayer('terrain')">
                    ⛰️
                </button>
                <button class="map-btn" id="btn-center" title="Centrar Mapa" onclick="centerMap()">
                    🎯
                </button>
            </div>
            
            <div class="status-bar" id="status-bar"></div>
        </main>
    </div>
    
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize Map - Vista satelital similar a Google Earth
        const map = L.map('map', {
            zoomControl: false
        }).setView([-6.6397, -79.3881], 14); // Chongoyape por defecto
        
        // Tile Layers - Usando Google Maps para mejor cobertura
        const layers = {
            satellite: L.tileLayer('https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
                attribution: '&copy; Google Maps',
                maxZoom: 21,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }),
            hybrid: L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
                attribution: '&copy; Google Maps',
                maxZoom: 21,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }),
            streets: L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                attribution: '&copy; Google Maps',
                maxZoom: 21,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            }),
            terrain: L.tileLayer('https://mt1.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
                attribution: '&copy; Google Maps',
                maxZoom: 21,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
            })
        };
        
        // Variable para la capa de tiles actual
        let currentTileLayer = layers.hybrid;
        
        // Establecer capa inicial (híbrido = satélite + etiquetas)
        currentTileLayer.addTo(map);
        
        let currentLayerName = 'satellite';
        let markers = [];
        let markersGroup = L.featureGroup().addTo(map);
        
        // Custom Icon
        function createCustomIcon(index) {
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="
                    background: linear-gradient(135deg, #00f0ff 0%, #00ff88 100%);
                    width: 36px;
                    height: 36px;
                    border-radius: 50% 50% 50% 0;
                    transform: rotate(-45deg);
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 4px 15px rgba(0, 240, 255, 0.5);
                    border: 2px solid white;
                ">
                    <span style="
                        transform: rotate(45deg);
                        font-family: 'Orbitron', sans-serif;
                        font-weight: bold;
                        color: #0a0e14;
                        font-size: 14px;
                    ">${index}</span>
                </div>`,
                iconSize: [36, 36],
                iconAnchor: [18, 36],
                popupAnchor: [0, -36]
            });
        }
        
        // Update zoom display
        map.on('zoomend', () => {
            document.getElementById('current-zoom').textContent = map.getZoom();
        });
        document.getElementById('current-zoom').textContent = map.getZoom();
        
        // Change map layer - Simplificado para Google Maps
        function setMapLayer(layerName) {
            // Remover la capa de tiles actual
            if (currentTileLayer) {
                map.removeLayer(currentTileLayer);
            }
            
            // Seleccionar la capa correcta
            if (layerName === 'satellite') {
                currentTileLayer = layers.hybrid; // Híbrido = satélite + etiquetas
            } else {
                currentTileLayer = layers[layerName];
            }
            
            currentTileLayer.addTo(map);
            
            // Asegurar que los marcadores estén al frente
            if (markersGroup) {
                markersGroup.bringToFront();
            }
            
            // Update buttons
            document.querySelectorAll('.map-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + layerName).classList.add('active');
            
            currentLayerName = layerName;
        }
        
        // Center map on markers
        function centerMap() {
            if (markers.length > 0) {
                map.fitBounds(markersGroup.getBounds(), { padding: [50, 50] });
            }
        }
        
        // Show status message
        function showStatus(message, type = 'success') {
            const statusBar = document.getElementById('status-bar');
            statusBar.textContent = message;
            statusBar.className = 'status-bar show ' + type;
            
            setTimeout(() => {
                statusBar.classList.remove('show');
            }, 3000);
        }
        
        // Show/hide loading
        function setLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }
        
        // Add markers to map
        function displayLocations(locations) {
            // Clear existing markers
            markersGroup.clearLayers();
            markers = [];
            
            // Add new markers
            locations.forEach((loc, index) => {
                const marker = L.marker([loc.lat, loc.lon], {
                    icon: createCustomIcon(index + 1)
                });
                
                marker.bindPopup(`
                    <div class="popup-title">${loc.descripcion}</div>
                    <div class="popup-coords">
                        📍 Lat: ${loc.lat.toFixed(6)}<br>
                        📍 Lon: ${loc.lon.toFixed(6)}
                    </div>
                `);
                
                markersGroup.addLayer(marker);
                markers.push(marker);
            });
            
            // Update stats
            document.getElementById('total-locations').textContent = locations.length;
            
            // Update list
            const listContainer = document.getElementById('locations-list');
            listContainer.innerHTML = locations.map((loc, index) => `
                <div class="location-card" onclick="flyToLocation(${loc.lat}, ${loc.lon})">
                    <div class="location-index">${index + 1}</div>
                    <div class="location-name">${loc.descripcion}</div>
                    <div class="location-coords">
                        ${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)}
                    </div>
                </div>
            `).join('');
            
            // Fit map to markers
            if (markers.length > 0) {
                map.fitBounds(markersGroup.getBounds(), { padding: [50, 50] });
            }
        }
        
        // Fly to specific location
        function flyToLocation(lat, lon) {
            map.flyTo([lat, lon], 17, {
                duration: 1.5
            });
            
            // Open popup
            markers.forEach(marker => {
                const markerLatLng = marker.getLatLng();
                if (Math.abs(markerLatLng.lat - lat) < 0.0001 && Math.abs(markerLatLng.lng - lon) < 0.0001) {
                    marker.openPopup();
                }
            });
        }
        
        // Load demo data
        async function loadDemoData() {
            setLoading(true);
            
            try {
                const response = await fetch('/demo');
                const data = await response.json();
                
                if (data.success) {
                    displayLocations(data.locations);
                    showStatus(`✓ ${data.count} ubicaciones cargadas (Demo)`, 'success');
                } else {
                    showStatus('Error cargando datos de demostración', 'error');
                }
            } catch (error) {
                showStatus('Error de conexión', 'error');
            }
            
            setLoading(false);
        }
        
        // File upload handling
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        
        // Drag and drop
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });
        
        // Handle file upload
        async function handleFile(file) {
            if (!file.name.match(/\.(xlsx|xls)$/i)) {
                showStatus('⚠ Solo se aceptan archivos Excel (.xlsx, .xls)', 'error');
                return;
            }
            
            setLoading(true);
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayLocations(data.locations);
                    showStatus(`✓ ${data.count} ubicaciones cargadas`, 'success');
                } else {
                    showStatus(`⚠ ${data.error}`, 'error');
                }
            } catch (error) {
                showStatus('Error de conexión con el servidor', 'error');
            }
            
            setLoading(false);
        }
    </script>
</body>
</html>
